{% extends "base.html" %}
{% block title %}Bad Request - MessMate{% endblock %}
{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-12 col-md-6 text-center">
    <div class="card p-4 shadow-sm border-0">
      <div class="display-1 text-warning fw-bold mb-3">400</div>
      <h3 class="fw-bold mb-2">Invalid Request</h3>
      <p class="text-muted mb-4">{{ error_description or "The request could not be processed due to invalid or missing data." }}</p>
      <div>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4">Return to Dashboard</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
