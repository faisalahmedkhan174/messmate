{% extends "base.html" %}
{% block title %}Server Error - MessMate{% endblock %}
{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-12 col-md-6 text-center">
    <div class="card p-4 shadow-sm border-0">
      <div class="display-1 text-danger fw-bold mb-3">500</div>
      <h3 class="fw-bold mb-2">Something Went Wrong</h3>
      <p class="text-muted mb-4">An unexpected server error occurred. Our team has been notified. Please try refreshing or return to the dashboard.</p>
      <div>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4">Return to Dashboard</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
