{% extends "base.html" %}
{% block title %}Login - MessMate{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm mt-4">
      <div class="card-body p-4">
        <h3 class="text-center mb-1">🍽️ MessMate</h3>
        <p class="text-center text-muted mb-4">Manager Login</p>
        <form method="post" novalidate>
          <div class="mb-3">
            <label class="form-label">Mess / Hostel Name</label>
            <input type="text" class="form-control form-control-lg" name="mess_name" value="{{ form.get('mess_name','') }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control form-control-lg" name="username" value="{{ form.get('username','') }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control form-control-lg" name="password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>
        </form>
        <p class="text-center mt-3 mb-0">
          New mess? <a href="{{ url_for('auth.register') }}">Register here</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
