{% extends "base.html" %}
{% block title %}Login - MessMate{% endblock %}
{% block content %}
<div class="row justify-content-center my-4 my-md-5">
  <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="display-6 mb-2">🍽️</div>
          <h3 class="fw-bold mb-1">MessMate</h3>
          <p class="text-muted small">Sign in to your manager portal</p>
        </div>

        <form method="post" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          
          <div class="mb-3">
            <label class="form-label">Mess / Hostel Name</label>
            <div class="input-group">
              <span class="input-group-text bg-white text-muted"><i class="bi bi-building"></i></span>
              <input type="text" class="form-control" name="mess_name"
                     value="{{ form.get('mess_name','') }}" placeholder="e.g. Green Valley Hostel" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Manager Username</label>
            <div class="input-group">
              <span class="input-group-text bg-white text-muted"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" name="username"
                     value="{{ form.get('username','') }}" placeholder="Username" required>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" name="password" placeholder="••••••••" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
            <i class="bi bi-box-arrow-in-right me-1"></i>Login
          </button>
        </form>

        <div class="text-center pt-3 border-top">
          <span class="text-muted small">Need to register a new mess?</span>
          <a href="{{ url_for('auth.register') }}" class="small fw-semibold ms-1">Create Account</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
